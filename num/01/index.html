<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>01 — Upper East Side</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

  <img
    class="background-map"
    src="image/webmap.png"
    alt=""
  >


  <header class="header">

    <div class="location-title">
      <h1>01</h1>
      <h2>UPPER EAST SIDE</h2>
      <p>Six entrances found across the Upper East Side.</p>
    </div>

  </header>


  <nav class="nav">

    <a href="../landing/index.html" class="active">
      MAP
    </a>

    <a href="../make/index.html">

    <a href="../archive/index.html">
      ARCHIVE
    </a>

    <a href="../about/index.html">
      ABOUT
    </a>

  </nav>


  <section class="content">

    <div class="door-grid">


      <div class="door-item" data-door="u1">

        <div class="card">

          <div class="card-face card-front">
            <img src="image/u1p.png" alt="U1">
          </div>

          <div class="card-face card-back">
            <img src="image/u1.jpg" alt="U1">
          </div>

        </div>

        <span>U1</span>

      </div>


      <div class="door-item" data-door="u2">

        <div class="card">

          <div class="card-face card-front">
            <img src="image/u2p.png" alt="U2">
          </div>

          <div class="card-face card-back">
            <img src="image/u2.jpg" alt="U2">
          </div>

        </div>

        <span>U2</span>

      </div>


      <div class="door-item" data-door="u3">

        <div class="card">

          <div class="card-face card-front">
            <img src="image/u3p.png" alt="U3">
          </div>

          <div class="card-face card-back">
            <img src="image/u3.jpg" alt="U3">
          </div>

        </div>

        <span>U3</span>

      </div>


      <div class="door-item" data-door="u4">

        <div class="card">

          <div class="card-face card-front">
            <img src="image/u4p.png" alt="U4">
          </div>

          <div class="card-face card-back">
            <img src="image/u4.jpg" alt="U4">
          </div>

        </div>

        <span>U4</span>

      </div>


      <div class="door-item" data-door="u5">

        <div class="card">

          <div class="card-face card-front">
            <img src="image/u5p.png" alt="U5">
          </div>

          <div class="card-face card-back">
            <img src="image/u5.jpg" alt="U5">
          </div>

        </div>

        <span>U5</span>

      </div>


      <div class="door-item" data-door="u6">

        <div class="card">

          <div class="card-face card-front">
            <img src="image/u6p.png" alt="U6">
          </div>

          <div class="card-face card-back">
            <img src="image/u6.jpg" alt="U6">
          </div>

        </div>

        <span>U6</span>

      </div>

    </div>


    <div class="map-column">

      <div class="map-caption">

        <span id="mapDoor">
          UPPER EAST SIDE
        </span>

        <span id="mapAddress">
          Hover over a door to see its location
        </span>

      </div>


      <div class="map-wrap">

        <img
          class="upper-map"
          src="image/01map.png"
          alt="Upper East Side map"
        >


        <button
          class="map-point"
          data-point="u1"
          type="button"
        >

          <span class="point-dot">
            U1
          </span>

          <span class="photo-pin">

            <span class="photo-box">
              <img src="image/u1.jpg" alt="U1">
            </span>

            <span class="photo-label">
              U1
            </span>

          </span>

        </button>


        <button
          class="map-point"
          data-point="u2"
          type="button"
        >

          <span class="point-dot">
            U2
          </span>

          <span class="photo-pin">

            <span class="photo-box">
              <img src="image/u2.jpg" alt="U2">
            </span>

            <span class="photo-label">
              U2
            </span>

          </span>

        </button>


        <button

              <img src="image/u4.jpg" alt="U4">
            </span>

            <span class="photo-label">
              U4
            </span>

          </span>

        <button
          class="map-point"

        >

          <span class="point-dot">

            <span class="photo-label">

            </span>

          </span>

        </button>

      </div>

    </div>

  <a
    class="back-button"

    ←
