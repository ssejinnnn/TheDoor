<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>05 — East Village</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap"

  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

  <img
    class="background-map"
    src="image/webmap.png"
    alt=""
  >


  <header class="header">

    <div class="location-title">

      <h1>05</h1>

      <h2>EAST VILLAGE</h2>

      <p>
        Six entrances found across the East Village.
      </p>

  <nav class="nav">

    <a

    <a href="../archive/index.html">

    <a href="../about/index.html">

  <section class="content">


    <div class="door-grid">


      <div
        class="door-item"
        data-door="e1"
      >

        <div class="card">

          <div class="card-face card-front">
            <img src="image/e1p.png" alt="E1">
          </div>

          <div class="card-face card-back">
            <img src="image/e1.jpg" alt="E1">
          </div>

        </div>

        <span>E1</span>

      </div>


      <div
        class="door-item"
        data-door="e2"
      >

        <div class="card">

          <div class="card-face card-front">
            <img src="image/e2p.png" alt="E2">
          </div>

          <div class="card-face card-back">

          </div>

        </div>

        <span>E2</span>

      </div>


      <div
        class="door-item"

          <div class="card-face card-back">
            <img src="image/e3.jpg" alt="E3">
          </div>

        </div>

        <span>E3</span>

      </div>


      <div
        class="door-item"
        data-door="e4"
      >

        <div class="card">

          <div class="card-face card-front">

            <img src="image/e5p.png" alt="E5">
          </div>

          <div class="card-face card-back">
            <img src="image/e5.jpg" alt="E5">
          </div>

        </div>

        <span>E5</span>

      </div>


      <div
        class="door-item"

        </div>

    <div class="map-column">


      <div class="map-caption">

        <span id="mapDoor">
          EAST VILLAGE
        </span>

        <span id="mapAddress">
          Hover over a door to see its location
        </span>

      </div>


      <div class="map-wrap">

        <img
          class="east-map"
          src="image/05map.png"
          alt="East Village map"
        >


        <button
          class="map-point"
          data-point="e1"
          type="button"
        >

          <span class="point-dot">
            E1
          </span>

          <span class="photo-pin">

            <span class="photo-box">
              <img src="image/e1.jpg" alt="E1">
            </span>

            <span class="photo-label">
              E1
            </span>

          </span>

        </button>


        <button
          class="map-point"
          data-point="e2"
